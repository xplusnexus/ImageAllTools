name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy ImageAll to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site (SSG)
        run: npm run build

      - name: Prepare FTP Configuration
        id: ftp-config
        run: |
          RAW_HOST="${{ secrets.HOSTINGER_FTP_HOST }}"
          # Automatically strip any protocols (ftp://, https://), ports (:21), trailing slashes, or whitespace
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^[a-zA-Z]*://||' -e 's|:[0-9]*$||' -e 's|/.*$||' | xargs)
          echo "host=$CLEAN_HOST" >> $GITHUB_OUTPUT

      - name: Deploy to Hostinger via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.host }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || './' }}
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
